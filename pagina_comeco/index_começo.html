
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link rel="stylesheet" href="css/style_comeco.css">

</head>

<body>

    <div class="container">

        <!-- Banner -->

               <button class="botao-banner" id="btnBanner">
                <i class="fa-solid fa-chevron-right"></i>
        </button>
            </button>

        <!-- Menu principal -->
        <main>

            <div class="menu">

                <a href="agendamento.html" class="card" data-nome="meu agendamento">

                </a>
