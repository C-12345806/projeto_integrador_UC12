
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ParkTime - Perfil</title>

    <link rel="stylesheet" href="css/style perfil.css">
</head>

<body>

    <div class="app">

        <!-- CABEÇALHO -->
        <header class="header">

            <div class="profile">

                <div class="avatar"></div>

                <h2>Ana Souza</h2>

            </div>

        </header>

        <!-- CONTEÚDO BRANCO -->
        <main class="content">

            <nav class="menu">

                <a href="#" class="menu-item" data-page="historico">

                    <div class="menu-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v5l-3 2"/>
                            <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
                        </svg>
                    </div>

                    <span>Histórico de visitas</span>

                    <b class="arrow">›</b>

                </a>

                <a href="#" class="menu-item" data-page="configuracoes">

                    <div class="menu-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>
                            <circle cx="12" cy="12" r="8"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </div>

                    <span>Configurações</span>

                    <b class="arrow">›</b>

                </a>

                <a href="#" class="menu-item" data-page="ajuda">

                    <div class="menu-icon">
                        <svg viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 11v5"/>
                            <path d="M12 7h.01"/>
                        </svg>
                    </div>

                    <span>Ajuda</span>

                    <b class="arrow">›</b>

                </a>

            </nav>

            <!-- MENSAGEM -->
            <section class="promo">

                <div class="heart">
                    <svg viewBox="0 0 24 24">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8z"/>
                    </svg>
                </div>

                <p>
                    Aproveite o ParkTime<br>
                    e tenha um dia incrível!
                </p>

            </section>

        </main>

    </div>

    <script src="js/script perfil.js"></script>

</body>
</html>
